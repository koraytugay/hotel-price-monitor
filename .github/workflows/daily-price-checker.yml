name: Daily Hotel Price Checker & Deploy Pages

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  push:
    branches:
      - main
  workflow_dispatch:
    # Allows manual triggering from GitHub Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  check-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Price Checker
        id: price_check
        run: |
          node scripts/check-prices.js
          if [ -f "data/price_status.json" ]; then
            CHANGED=$(node -e "console.log(JSON.parse(fs.readFileSync('data/price_status.json')).priceChanged)")
            echo "PRICE_CHANGED=$CHANGED" >> $GITHUB_OUTPUT
          else
            echo "PRICE_CHANGED=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and Push Updated Prices Data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(data): auto-update room prices [skip ci]"
          file_pattern: "data/*"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          push_options: '--force'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Send Email Alert (Only If Price Changed)
        if: steps.price_check.outputs.PRICE_CHANGED == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.mail.me.com
          server_port: 587
          username: ${{ secrets.ICLOUD_EMAIL }}
          password: ${{ secrets.ICLOUD_APP_PASSWORD }}
          subject: "🔔 Hotel Price Alert: Bayview Wildwood Resort Rate Changed!"
          to: ${{ secrets.NOTIFICATION_EMAILS || secrets.ICLOUD_EMAIL }}
          from: ${{ secrets.ICLOUD_EMAIL }}
          html_body_file: data/email_body.html

  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: check-prices
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
