name: Daily Hotel Price Checker & Deploy Pages

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  push:
    branches:
      - main
  workflow_dispatch:
    # Allows manual triggering from GitHub Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  check-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Price Checker
        run: node scripts/check-prices.js

      - name: Commit and Push Updated Prices Data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(data): auto-update room prices [skip ci]"
          file_pattern: "data/*"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          push_options: '--force'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Send Email Notification via iCloud SMTP
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.mail.me.com
          server_port: 587
          username: ${{ secrets.ICLOUD_EMAIL }}
          password: ${{ secrets.ICLOUD_APP_PASSWORD }}
          subject: "🏨 Bayview Wildwood Resort - Hotel Price Update"
          to: ${{ secrets.ICLOUD_EMAIL }}
          from: ${{ secrets.ICLOUD_EMAIL }}
          html_body: |
            <div style="font-family: Arial, sans-serif; max-width: 600px; padding: 20px; border: 1px solid #e2e8f0; border-radius: 10px; background-color: #f8fafc;">
              <h2 style="color: #0f172a; margin-top: 0;">🏨 Bayview Wildwood Resort Price Monitor</h2>
              <p style="color: #475569;"><strong>Location:</strong> Severn Bridge, ON</p>
              <p style="color: #475569;"><strong>Occupancy:</strong> 2 Adults, 2 Children (age 9, 9)</p>
              
              <hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 20px 0;" />
              
              <div style="background-color: #ffffff; padding: 15px; border-radius: 8px; border: 1px solid #cbd5e1; margin-bottom: 15px;">
                <h3 style="margin-top: 0; color: #0284c7;">🗓️ Oct 10 – Oct 12 (2-Night Stay)</h3>
                <p style="margin: 5px 0; font-size: 1.1em;"><strong>Grand Total:</strong> $947 CAD ($473.50/night)</p>
                <p style="margin: 5px 0; color: #64748b; font-size: 0.9em;">Base Room: $758 CAD | Taxes & Fees: $189 CAD</p>
              </div>

              <div style="background-color: #ffffff; padding: 15px; border-radius: 8px; border: 1px solid #cbd5e1; margin-bottom: 20px;">
                <h3 style="margin-top: 0; color: #d97706;">🗓️ Oct 9 – Oct 12 (3-Night Stay)</h3>
                <p style="margin: 5px 0; font-size: 1.1em;"><strong>Grand Total:</strong> $1,421 CAD ($473.67/night)</p>
                <p style="margin: 5px 0; color: #64748b; font-size: 0.9em;">Base Room: $1,137 CAD | Taxes & Fees: $284 CAD</p>
              </div>

              <a href="https://koraytugay.github.io/hotel-price-monitor/" style="display: inline-block; padding: 12px 20px; background-color: #2563eb; color: #ffffff; text-decoration: none; border-radius: 6px; font-weight: bold;">View Live Web Dashboard ↗</a>
            </div>

  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: check-prices
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
